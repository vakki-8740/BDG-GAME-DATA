<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER PENNAL - BDG Service Center</title>
    <link rel="icon" href="../../../IMAGE/faviconV2.png" type="image/png">
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <a href="../../index.html" class="back-circle" title="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <h1 class="login-title">USER PENNAL</h1>
        <div class="login-box">
            <input type="text" id="loginName" placeholder="Enter Your Name" autocomplete="off">
            <input type="text" id="loginUid" placeholder="Enter Your UID" autocomplete="off">
            <select id="loginLang">
                <option value="" disabled selected>Select Language</option>
                <option value="English">English</option>
                <option value="Hinglish">Hinglish</option>
                <option value="Urdu">Urdu</option>
                <option value="Arabic">Arabic</option>
            </select>
            <button id="loginBtn" class="login-btn">Start Chat</button>
            <p id="loginError" class="login-error"></p>
        </div>
    </div>

    <div id="uidModal" class="modal hidden">
        <div class="modal-box">
            <button id="uidModalClose" class="modal-close">&times;</button>
            <img src="IMAGES/IMAGE-UID.jpg" alt="UID Image" class="modal-img">
        </div>
    </div>

    <div id="chatApp" class="chat-app hidden">

        <header class="chat-header">
            <a href="../../index.html" class="back-circle" title="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>
            <div class="user-info">
                <div class="avatar">S</div>
                <div class="name-status">
                    <span class="chat-name">Support Team</span>
                    <span class="status"><span class="status-dot online"></span> Online</span>
                </div>
            </div>
            <div class="menu-wrap">
                <button id="menuBtn" class="menu-btn" title="Menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div id="menuDropdown" class="menu-dropdown hidden">
                    <button id="logoutBtn" class="logout-btn">Log Out</button>
                </div>
            </div>
        </header>

        <div id="chatBody" class="chat-body"></div>

        <div id="replyBar" class="reply-bar hidden">
            <div class="reply-info">
                <span class="reply-label">Replying to <b id="replyName"></b></span>
                <span id="replyText" class="reply-text"></span>
            </div>
            <button id="replyClose" class="reply-close">&times;</button>
        </div>

        <div class="chat-input-bar">
            <button id="imageBtn" class="input-btn" title="Send Image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <input type="file" id="imageFile" accept="image/*" hidden>
            <button id="fileBtn" class="input-btn" title="Send File">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="fileInput" hidden>
            <input type="text" id="msgInput" class="msg-input" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn" class="send-btn">Send</button>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="chat.js"></script>
</body>
</html>
