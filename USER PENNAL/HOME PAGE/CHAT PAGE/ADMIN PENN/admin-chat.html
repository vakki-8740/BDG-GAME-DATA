<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - ADMIN PENNAL</title>
    <link rel="icon" href="../../../../IMAGE/faviconV2.png" type="image/png">
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <div class="chat-app">

        <header class="chat-header">
            <a href="index.html" class="back-link">&larr; Back</a>
            <div class="user-info">
                <div class="avatar" id="selAvatar">U</div>
                <div class="name-status">
                    <span class="chat-name" id="selName">User</span>
                    <span class="status" id="selStatus"><span class="status-dot online"></span> Online</span>
                </div>
                <span class="lang-badge" id="selLang">English</span>
            </div>
        </header>

        <div id="chatBody" class="chat-body">
            <div class="chat-empty">No messages yet. Say hello!</div>
        </div>

        <div id="replyBar" class="reply-bar hidden">
            <div class="reply-info">
                <span class="reply-label">Replying to <b id="replyName"></b></span>
                <span id="replyText" class="reply-text"></span>
            </div>
            <button id="replyClose" class="reply-close">&times;</button>
        </div>

        <div class="chat-input-bar">
            <button id="imageBtn" class="input-btn" title="Send Image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <input type="file" id="imageFile" accept="image/*" hidden>
            <button id="fileBtn" class="input-btn" title="Send File">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="fileInput" hidden>
            <input type="text" id="msgInput" class="msg-input" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn" class="send-btn">Send</button>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="admin-chat.js"></script>
    <script src="notify.js"></script>
    <script>
        attachChatNotifyListeners();
    </script>
</body>
</html>
