<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDG Service Center</title>
    <link rel="icon" href="../../IMAGE/faviconV2.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header class="banner">
            <img src="../../IMAGE/BANNER.jpg" alt="Banner">
        </header>

        <main class="main">

            <div class="home-head">
                <h1 class="heading-left">SELECT PROBLEM</h1>
                <a href="mailbox.html" class="mailbox-btn" title="Mail Box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
                </a>
            </div>

            <div class="options">
                <button class="option" data-option="faq">
                    <img src="../../ICONS/FAQ.jpg" alt="FAQ">
                    <span>FAQ</span>
                </button>

                <button class="option" data-option="deposit">
                    <img src="../../ICONS/DEPOSITE-PROBLEM.jpg" alt="Deposite Not Recevie">
                    <span>Deposite Problem</span>
                </button>

                <button class="option" data-option="withdrawal">
                    <img src="../../ICONS/WITHDRWAL-PROBLM.jpg" alt="Withdrawal Problem">
                    <span>Withdrwal Problem</span>
                </button>

                <button class="option" data-option="game">
                    <img src="../../ICONS/GAME-PROBLEM.jpg" alt="Game Problem">
                    <span>Game Problem</span>
                </button>

                <button class="option" data-option="livechat">
                    <img src="../../ICONS/LIVE-CHAT.jpg" alt="Live Chat">
                    <span>Live Chat</span>
                </button>
            </div>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
